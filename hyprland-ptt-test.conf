# Push-to-Talk Test Keybindings for Hyprland
# Add these to your ~/.config/hypr/hyprland.conf

# Start recording on press
bind = SUPER SHIFT, Space, exec, /home/seb/code/cloned/transcribe-rs-v2/ptt-test.sh start

# Stop recording on release
bindr = SUPER SHIFT, Space, exec, /home/seb/code/cloned/transcribe-rs-v2/ptt-test.sh stop

# To test:
# 1. Add these lines to your hyprland.conf
# 2. Reload config: hyprctl reload
# 3. Hold Super+Shift+Space and speak
# 4. Release to stop recording
