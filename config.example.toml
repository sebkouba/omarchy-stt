# Example configuration for omarchy-stt
# Copy to ~/.config/transcribe-rs/config.toml and customize

[audio]
# Your microphone device name (use 'list-microphones' to find it)
# Example: "alsa_input.usb-Blue_Microphones_Yeti_Stereo_Microphone_REV8-00.analog-stereo"
microphone = "YOUR_MICROPHONE_DEVICE_HERE"

# Audio sample rate (16000 Hz required by models)
sample_rate = 16000

# Temporary recording file location
recording_path = "/tmp/ptt_current.wav"

# Recording state file (stores buffer position)
recording_pid_file = "/tmp/ptt_recording.pid"

# Debug log file
log_file = "/tmp/ptt_rust_debug.log"

[model]
# Path to model directory
# For AUR package install: Use absolute path below
# For dev setup: Use relative path like "models/parakeet-tdt-0.6b-v3-int8"
path = "/usr/share/omarchy-stt/models/parakeet-tdt-0.6b-v3-int8"

# Transcription engine ("parakeet" or "whisper")
engine = "parakeet"

# Quantization level ("int8" for speed, "fp32" for accuracy)
quantization = "int8"

[daemon]
# Unix socket path for transcription daemon
socket_path = "/tmp/transcribe-rs-v2.sock"

[integration]
# Automatically paste transcribed text to active window
auto_paste = true

# Restore original clipboard after pasting (prevents clipboard pollution)
prevent_clipboard_pollution = true

# Add space after sentence-ending punctuation (.!?) for natural flow
add_space_after_punctuation = true

# Terminal applications (use Ctrl+Shift+V instead of Ctrl+V)
terminal_apps = [
    "alacritty",
    "kitty",
    "wezterm",
    "foot",
    "terminal",
    "konsole",
    "terminator",
    "xterm",
    "urxvt",
    "st",
]

[llm]
# Enable LLM post-processing (requires GROQ_API_KEY environment variable)
# Get free API key at: https://console.groq.com
enabled = false

# Groq model to use (fast and accurate)
model = "moonshotai/kimi-k2-instruct-0905"

# Maximum tool call iterations (safety limit)
max_tool_calls = 5

[hotkey]
# Global hotkey configuration (requires XDG Desktop Portal)
# Default: Super+Shift+Space

# Modifier keys (combine multiple: ["Super", "Shift", "Control", "Alt"])
modifiers = ["Super", "Shift"]

# Main key (letters, numbers, or special keys like "Space", "Return", etc.)
key = "Space"

[logging]
# Enable dictation logging for analysis (CSV format)
# Files created in ~/.config/transcribe-rs/
enable_logging = false

# Log LLM corrections separately
enable_llm_logging = false

[transcription_corrections]
# Path to fuzzy correction rules (optional)
# See /usr/share/omarchy-stt/transcription_corrections.json.example
# corrections_file = "~/.config/transcribe-rs/transcription_corrections.json"

[tools]
# Path to LLM tool definitions (optional, for voice commands)
# See /usr/share/omarchy-stt/tools.json.example if available
# tools_file = "~/.config/transcribe-rs/tools.json"
