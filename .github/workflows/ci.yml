name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libleptonica-dev libtesseract-dev libvulkan-dev
          # Create stub glslc for Vulkan build (CI doesn't need actual shader compilation)
          echo '#!/bin/bash' | sudo tee /usr/local/bin/glslc
          echo 'exit 0' | sudo tee -a /usr/local/bin/glslc
          sudo chmod +x /usr/local/bin/glslc

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib
      - run: cargo test --test hotkey_state --test hotkey_integration
