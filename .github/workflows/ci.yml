name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libleptonica-dev libtesseract-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo check --all-targets
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
          WHISPER_NO_METAL: 1
          WHISPER_NO_VULKAN: 1
      - run: cargo clippy --all-targets -- -D warnings
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
          WHISPER_NO_METAL: 1
          WHISPER_NO_VULKAN: 1
      - run: cargo test --lib
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
          WHISPER_NO_METAL: 1
          WHISPER_NO_VULKAN: 1
      - run: cargo test --test hotkey_state --test hotkey_integration
        env:
          WHISPER_DONT_GENERATE_BINDINGS: 1
          WHISPER_NO_METAL: 1
          WHISPER_NO_VULKAN: 1
