[package]
name = "transcribe-rs"
version = "0.1.4"
edition = "2021"
description = "A simple library to help you transcribe audio"
license = "MIT"
repository = "https://github.com/cjpais/transcribe-rs"

[dependencies]
hound = "3.5.1"
log = "0.4.28"
ndarray = "0.16.1"
ort = { version = "2.0.0-rc.10" }
log4rs = { version = "1.3", features = ["yaml_format"] }
regex = "1.11.2"
thiserror = "2.0.16"
once_cell = "1.21.3"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "signal"] }
async-openai = { version = "0.30" }
async-trait = { version = "0.1.89" }
derive_builder = { version = "0.20.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
notify-rust = "4.11"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
ctrlc = "3.4"
rapidfuzz = "0.5.0"
ureq = { version = "2.9", features = ["json"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
similar = "2.6"
leptess = { version = "0.14", optional = true }
eframe = "0.30"
egui = "0.30"
notify = "6.1"
evdev-shortcut = "0.1.5"
evdev = "0.12"
glob = "0.3"
futures = "0.3"
zbus = "5"
silero-vad-rust = "6.2"

[features]
default = ["ocr"]
ocr = ["leptess"]

[[bin]]
name = "transcribe"
path = "src/bin/cli.rs"

[[bin]]
name = "transcribe-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "transcribe-client"
path = "src/bin/client.rs"

[[bin]]
name = "recording-daemon"
path = "src/bin/recording-daemon.rs"

[[bin]]
name = "hotkey-daemon"
path = "src/bin/hotkey-daemon.rs"

[[bin]]
name = "indicator-catalogue"
path = "src/bin/indicator-catalogue.rs"

[[bin]]
name = "indicator-catalogue-v2"
path = "src/bin/indicator-catalogue-v2.rs"

[[bin]]
name = "indicator-preview"
path = "src/bin/indicator-preview.rs"

[[bin]]
name = "indicator-daemon"
path = "src/bin/indicator-daemon.rs"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["vulkan"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "poll"] }

[dev-dependencies]
tempfile = "3.23.0"
